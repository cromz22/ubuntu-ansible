- hosts: localhost
  gather_facts: false

  vars:
    home_dir: "{{ lookup('env', 'HOME') }}"

  tasks:
    - name: Install Git LFS
      become: true
      ansible.builtin.apt:
        name: git-lfs
        state: present
        update_cache: true

    - name: Check whether Git LFS is initialized
      ansible.builtin.command:
        argv:
          - git
          - config
          - --global
          - --get
          - filter.lfs.process
      environment:
        HOME: "{{ home_dir }}"
      register: git_lfs_filter_process
      changed_when: false
      failed_when: git_lfs_filter_process.rc not in [0, 1]

    - name: Initialize Git LFS for the invoking user
      ansible.builtin.command:
        argv:
          - git
          - lfs
          - install
      environment:
        HOME: "{{ home_dir }}"
      when: git_lfs_filter_process.rc == 1
